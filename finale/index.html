<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Sacs à Main</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet"> <!-- Lien vers le CSS personnalisé -->
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Liste des Sacs</h1>
        <div class="d-flex justify-content-between mb-3">
            <!-- Bouton pour ajouter un nouveau sac -->
            <button class="btn btn-primary" onclick="window.location.href='add.html'">Ajouter Nouveau Sac</button>

            <!-- Filtre pour afficher les sacs par état -->
            <div class="d-flex align-items-center">
                <label for="filter" class="me-2">Filtrer :</label>
                <select id="filter" class="form-select" onchange="filterSacs()">
                    <option value="all">Tous</option>
                    <option value="vendu">Vendu</option>
                    <option value="disponible">Disponible</option>
                </select>
            </div>
        </div>

        <!-- Conteneur pour afficher les cartes des sacs -->
        <div id="sacsContainer" class="row">
            <!-- Les cartes des sacs seront injectées ici via JavaScript -->
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
