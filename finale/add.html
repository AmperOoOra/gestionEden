<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un Sac</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="text-center">Ajouter un Nouveau Sac</h1>
        <form id="uploadForm">
            <div class="mb-3">
                <label for="image" class="form-label">Image du Sac</label>
                <input type="file" id="image" name="image" class="form-control" accept="image/*" required>
            </div>
            <div class="mb-3">
                <label for="prix" class="form-label">Prix</label>
                <input type="number" id="prix" class="form-control" min="0" step="0.01" required>
            </div>
            <button type="submit" class="btn btn-success">Ajouter</button>
        </form>
    </div>
    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (event) => {
            event.preventDefault();

            const formData = new FormData();
            const imageInput = document.getElementById('image');
            const prixInput = document.getElementById('prix');

            formData.append('image', imageInput.files[0]);
            formData.append('prix', prixInput.value);

            try {
                const response = await fetch('http://localhost:3000/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    const sacs = JSON.parse(localStorage.getItem('sacs')) || [];

                    sacs.push({
                        image: data.filePath,
                        prix: parseFloat(prixInput.value),
                        dateAjout: new Date().toISOString(),
                        vendu: false
                    });

                    localStorage.setItem('sacs', JSON.stringify(sacs));
                    alert('Sac ajouté avec succès.');
                    window.location.href = 'index.html';
                } else {
                    alert('Erreur lors du téléchargement de l\'image.');
                }
            } catch (error) {
                console.error('Erreur :', error);
                alert('Impossible de contacter le serveur.');
            }
        });
    </script>
</body>
</html>
